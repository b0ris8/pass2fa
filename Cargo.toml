[package]
name = "otp_local_gui"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "pass2fa"
path = "src/main.rs"

[[bin]]
name = "pass2faw"
path = "src/bin/pass2faw.rs"

[features]
# только для скриншотов при разработке: автовход по $PASS2FA_DEV_PASS и снимок окна
devshot = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "default_fonts", "clipboard"] }
age = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
dirs = "6"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp"] }
resvg = { version = "0.49", default-features = false }
miniz_oxide = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
